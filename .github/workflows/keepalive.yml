#  讓 Supabase 不要睡著
#  ------------------------------------------------------------
#  為什麼需要它？
#  Supabase 免費方案會把「活動量太低」的專案暫停。暫停不會刪資料，
#  但網頁的資料庫那半會整個連不上，要手動去後台按恢復、等好幾分鐘。
#
#  ⚠️ 頻率是這件事唯一的關鍵，不要隨便調低。
#
#  Supabase 官方文件（2026-09-22 版）的原話是：
#    「典型來說，過去一週內**每天**有幾個使用者請求打到資料庫，
#      就足以避免被暫停。」
#
#  2026-10-19 第一次被暫停後，我把排程設成「週一、週四」——
#  一週只有兩次，低於官方講的「每天」。結果 2026-11-19 又被暫停了，
#  而且 11/16 才剛成功戳過，三天就掉。前幾次撐過去是運氣不是設計正確。
#
#  所以現在改成**一天兩次**，而且每次讀三張表，
#  讓每天的請求數穩穩落在「幾個」的範圍裡。
#
#  ⚠️ 另外兩件要知道的事：
#  1. **這不是保證。** 官方自己寫「有可能你在用它，但活動量仍然不夠」，
#     社群也有人每天 500–700 次請求還是被暫停。唯一保證不被暫停的方法
#     是升級付費方案。
#  2. **Supabase 會先寄警告信**（暫停前約一週）和暫停通知信給帳號擁有者。
#     那封信是最早的訊號，看到就去開一下後台。
#
#  還有一個跑不掉的限制：GitHub 規定公開倉庫超過 60 天沒有任何更動，
#  排程會被自動停用。被停用時 GitHub 會寄信，到 Actions 頁面
#  按一下「Enable workflow」就會恢復。

name: 讓 Supabase 不要睡著

on:
  schedule:
    # 時間是 UTC。03:00 與 15:00 UTC＝台灣時間上午 11 點與晚上 11 點。
    # 一天兩次，是為了讓「每天都有活動」這件事有冗餘——
    # GitHub 的排程本來就可能延遲或在高載時被跳過。
    - cron: '0 3,15 * * *'
  workflow_dispatch:          # 也可以手動在 Actions 頁面按一下就跑

# 同時只跑一個，排程塞車時不要疊起來
concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: 讀一下資料庫
        run: |
          # 這把金鑰是公開金鑰，本來就寫在 public/js/supabase-config.js 裡，
          # 不是密碼，所以不需要設成 GitHub Secret。
          # 沒登入的話安全規則會讓它回傳空陣列，但「有連到資料庫」這件事成立，
          # 而那正是我們要的。
          KEY="sb_publishable_Ps-AVHlvlXk8HavZdshYmw_19nZJdoY"
          BASE="https://lvhfwadbaxniuyryrngz.supabase.co/rest/v1"

          fail=0
          # 讀三張表＝三次真正的資料庫查詢，不是一次
          for t in habit_log habit_items ladder_state; do
            code=$(curl -s -o /tmp/body -w '%{http_code}' --max-time 30 \
                     "$BASE/$t?select=*&limit=1" \
                     -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
            if [ "$code" = "200" ]; then
              echo "OK   $t"
            else
              echo "FAIL $t  HTTP $code  $(head -c 200 /tmp/body)"
              fail=1
            fi
          done

          if [ "$fail" = "1" ]; then
            echo "::error::資料庫沒有正常回應。多半是又被暫停了——"\
"到 https://supabase.com/dashboard/project/lvhfwadbaxniuyryrngz 按 Resume project。"
            exit 1
          fi

          echo "三張表都正常，這一天的活動量已經記上了。"
